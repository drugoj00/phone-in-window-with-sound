<script>
var I18N = {"en": {"name": "App Menu", "title": "App Menu: full-screen app menu for TV boxes and phones (free)", "h1": "App menu for TV boxes, car head units and phones", "lead": "A full-screen app menu for Android TV boxes, car head units and phones: remote, touch, mouse and air mouse. Long press an icon for stop, cache, data, permissions, folders and any app version. No ads.", "dl": "Download APK", "gh": "View on GitHub", "back": "All our programs", "dlnote": "Current version: 1.1. AppMenu-1.1.apk. Free, no ads. Android 6.0 and newer. Interface in English, Ukrainian and Russian.", "f_h": "Features", "s_h": "Screenshots", "st_h": "Quick start", "lm_h": "Limitations and warnings", "d_h": "Support the project", "d_p": "The app is free. If it is useful you can support its development by card, Google Pay or USDT. For USDT use only the TRON network (TRC20): coins sent over another network are lost.", "d_btn": "Donation options", "c1": "App Menu replaces the stock app list with a big grid made for a remote and for touch. It has what stock launchers lack: a One UI style action card on every icon, folders, installing and removing apps in batches, backups before deleting and installing any version, including an older one.", "feats": [["What's new in 1.1", "Root (Magisk) instead of ADB: if the device is rooted (a car head unit, a TV box, a phone), the app works without a computer and without debugging — stop, cache, data, permissions, special access, silent install and uninstall, OBB, downgrade and USB drives all go through root. Allow root for the app in Magisk once; the app then connects by itself. Settings → “Connect ADB” has a “Connect via root” button and a switch. Without root everything works over ADB as before. You choose: the switch decides what is used at start, and the ADB connect buttons switch to ADB. • Fixed: on Samsung phones installing over ADB could add a second icon of the same app (a copy in “Dual app”). Apps are now installed only for the current user."], ["Menu for remote, touch, mouse and air mouse", "A full-screen grid: OK opens, holding OK or the Menu key shows actions, touch and mouse work as usual (left button opens, right button shows actions, wheel scrolls). Columns, icon size down to tiny (5 columns on a phone), labels, sorting (name, new, old, most used, your own), search, hiding, list mode."], ["Action card on every icon", "Like in One UI: stop, clear cache, clear data, permissions, special access (with automatic restore after a reboot), battery, hide, uninstall, icon, folder, versions. Needs ADB of the same device (see below)."], ["Folders", "Drag one icon onto another to make a folder, drag icons into it or add them from inside; rename and delete. The folder window is a 5×5 grid."], ["Install from anywhere", "APK, split packages (APKS, APKM, XAPK, ZIP with APK and OBB: the parts that fit the device are chosen automatically), from a folder or an archive (ZIP, 7z, RAR, TAR), from the built-in file manager, from USB drives (through ADB, when the system hides them), from network folders (SMB, with search in the local network), from a phone or a computer over Wi‑Fi (a page in the browser) and from the internet (F-Droid, GitHub, a direct link). Batch install and batch delete."], ["Backups and any version", "Before an app is deleted its APK is saved. Install any saved version, a version from the F-Droid catalogue or your own file, an older one too (the current version is saved first)."], ["Launcher mode", "Home shows this menu, a second press of Home opens the native home screen, Back returns from an app to the menu. Turn it on and off in Settings."], ["Look and language", "Dark, black (OLED), light or like the system theme, six accent colours, Russian, Ukrainian and English, own icons and icon packs, backup and restore of settings."], ["Simple ADB connection", "On Android 9 TV boxes with network ADB it connects by itself. On Android 11+ press “Connect automatically”: the app turns on wireless debugging, reads the pairing code and pairs on its own (needs its accessibility service, which acts only after you press the button). Android 10 and older: one command from a computer, then it connects by itself."], ["Free", "No ads, open source."]], "steps": ["Download AppMenu-1.1.apk and install it (allow installing from this source if Android asks). The icon “App Menu” appears in the list of apps (on a TV box in the Leanback launcher).", "Open it: apps are launched with OK or a tap, a long press (or holding OK, or the Menu key) opens the action card. To use it instead of the stock menu turn on “Launcher mode” in Settings.", "To act on other apps connect ADB: Settings → “Connect ADB”. Android 9 and older TV boxes with network ADB connect by themselves. Android 11+: turn on the “App Menu” service in Accessibility once, press “Connect automatically”. Android 10 and older: run adb tcpip 5555 once from a computer (repeat after a reboot). With root (Magisk) none of this is needed: allow root for the app once and it connects by itself."], "lims": ["Actions on other apps need ADB debugging of the same device or root (Magisk). App Menu works locally and sends nothing anywhere; the only network requests are the ones you start yourself (F-Droid and GitHub search, a link you type).", "The automatic ADB connection on Android 11+ uses an accessibility service. It reads only the system settings windows and acts only for three minutes after you press “Connect automatically”. It is tested on Samsung One UI; other firmwares may word the settings differently, then use the manual way.", "Real Wi‑Fi Direct is not used: files are received over a page in a browser in the same network or through the hotspot of a phone. OBB files on Android 11 and newer can only be copied through ADB.", "System apps cannot be uninstalled. Not on Google Play: download the APK here; Android may warn about an unknown source.", "Tested on Android 9, 10, 11, 12 and 15. Android 13 and 14 and other makers’ firmwares are not tested yet; reports are welcome. Known: Samsung Dual Messenger copies show up as separate icons."], "smart": "The APK is signed but is not on Google Play, so Android may ask you to allow installing from this source. The SHA-256 checksum is in the release description.", "note": "App Menu is an independent project, not related to Google. Android and Android TV are trademarks of Google LLC.", "f_rel": "All versions", "f_issue": "Report a problem", "f_src": "Source on GitHub", "f_contacts": "Contacts", "f_terms": "Terms and conditions", "f_refund": "Refund policy", "f_oferta": "Public offer", "star_btn": "⭐ Star on GitHub", "star_p": "A free way to help: put a star on the GitHub repository. It costs nothing and helps other people find the program.", "cap_menu": "The menu on a TV box: a big grid made for a remote.", "cap_actions": "Long press an icon: stop, cache, data, permissions, special access, battery, hide, uninstall, icon, folder, versions.", "cap_folder": "A folder: drag icons into it or add them from inside.", "cap_versions": "Any version of an app: saved copies, the F-Droid catalogue, your own file. An older one too.", "cap_bundle": "A split package (APKS, XAPK) installs as one app: the right parts are chosen for the device.", "cap_phone": "On a phone: the same menu in portrait."}, "ru": {"name": "Меню приложений", "title": "Меню приложений: полноэкранное меню приложений для приставок и телефонов (бесплатно)", "h1": "Меню приложений для приставок, автомагнитол и телефонов", "lead": "Полноэкранное меню приложений для приставок Android TV, автомагнитол и телефонов: пульт, касание, мышь и аэромышь. Долгое нажатие на значок: остановить, кэш, данные, права, папки и любая версия приложения. Без рекламы.", "dl": "Скачать APK", "gh": "Смотреть на GitHub", "back": "Все наши программы", "dlnote": "Текущая версия: 1.1. AppMenu-1.1.apk. Бесплатно, без рекламы. Android 6.0 и новее. Интерфейс на русском, украинском и английском.", "f_h": "Возможности", "s_h": "Скриншоты", "st_h": "Быстрый старт", "lm_h": "Ограничения и предупреждения", "d_h": "Поддержать проект", "d_p": "Программа бесплатная. Если она вам полезна, можно поддержать разработку банковской картой, Google Pay или USDT. Для USDT только сеть TRON (TRC20): монеты, отправленные по другой сети, теряются.", "d_btn": "Способы поддержки", "c1": "Меню приложений заменяет штатный список приложений большой сеткой для пульта и для касания. В нём есть то, чего не хватает штатным лаунчерам: карточка действий на каждом значке, как в One UI, папки, пакетная установка и удаление, копии перед удалением и установка любой версии, в том числе более старой.", "feats": [["Что нового в 1.1", "Root (Magisk) вместо ADB: если на устройстве есть root (автомагнитола, приставка, телефон), программа работает без компьютера и без отладки — остановка, кэш, данные, права, спецдоступ, тихая установка и удаление, OBB, понижение версии и флешки идут через root. Один раз разрешите root программе в Magisk — дальше она подключается сама. В «Настройки» → «Подключить ADB» есть кнопка «Подключить через root» и переключатель. Без root всё работает по ADB, как раньше. Выбор за вами: переключатель решает, что использовать при запуске, а кнопки подключения ADB переключают на ADB. • Исправлено: на телефонах Samsung установка по ADB могла добавить второй значок того же приложения (копию в «Двойном приложении»). Теперь приложения ставятся только текущему пользователю."], ["Меню для пульта, касания, мыши и аэромыши", "Полноэкранная сетка: ОК открывает, удержание ОК или кнопка «Меню» показывает действия, касание и мышь работают как обычно (левая кнопка открывает, правая показывает действия, колесо прокручивает). Столбцы, размер значков до очень мелких (на телефоне 5 столбцов), подписи, сортировка (имя, новые, старые, частые, своя), поиск, скрытие, режим списка."], ["Карточка действий на каждом значке", "Как в One UI: остановить, очистить кэш, очистить данные, разрешения, спецдоступ (с автовосстановлением после перезагрузки), батарея, скрыть, удалить, значок, папка, версии. Нужен ADB этого же устройства (см. ниже)."], ["Папки", "Перетащи один значок на другой, чтобы получилась папка, перетаскивай значки в неё или добавляй изнутри; переименование и удаление. Окно папки: сетка 5×5."], ["Установка откуда угодно", "APK, пакеты из нескольких частей (APKS, APKM, XAPK, ZIP с APK и OBB: нужные устройству части выбираются сами), из папки или архива (ZIP, 7z, RAR, TAR), из встроенного файлового менеджера, с флешек (через ADB, когда система их не показывает), из сетевых папок (SMB, с поиском в локальной сети), с телефона или компьютера по Wi‑Fi (страница в браузере) и из интернета (F-Droid, GitHub, прямая ссылка). Пакетная установка и пакетное удаление."], ["Копии и любая версия", "Перед удалением приложения его APK сохраняется. Ставь любую сохранённую версию, версию из каталога F-Droid или свой файл, в том числе более старую (текущая версия перед этим сохраняется)."], ["Режим лаунчера", "Кнопка «Домой» показывает это меню, второе нажатие открывает родной главный экран, «Назад» из приложения возвращает в меню. Включается и выключается в настройках."], ["Вид и язык", "Тема: тёмная, чёрная (OLED), светлая или как в системе; шесть цветов акцента; русский, украинский и английский; свои значки и наборы значков; копия и восстановление настроек."], ["Простое подключение ADB", "На ТВ-приставках с Android 9 и включённым сетевым ADB подключается само. На Android 11+ нажми «Подключить автоматически»: программа включит беспроводную отладку, прочитает код сопряжения и сопряжётся сама (нужна её служба спецвозможностей, она действует только после твоего нажатия). Android 10 и старше: один раз команда с компьютера, дальше подключается само."], ["Бесплатно", "Без рекламы, исходный код открыт."]], "steps": ["Скачайте AppMenu-1.1.apk и установите его (если Android спросит, разрешите установку из этого источника). Значок «Меню приложений» появится в списке приложений (на ТВ-приставке в Leanback-лаунчере).", "Откройте: приложения запускаются по ОК или касанию, долгое нажатие (удержание ОК или кнопка «Меню») открывает карточку действий. Чтобы пользоваться им вместо штатного меню, включите «Режим лаунчера» в настройках.", "Для действий над другими приложениями подключите ADB: «Настройки» → «Подключить ADB». ТВ-приставки с Android 9 и сетевым ADB подключаются сами. Android 11+: один раз включите службу «Меню приложений» в спецвозможностях и нажмите «Подключить автоматически». Android 10 и старше: один раз выполните adb tcpip 5555 с компьютера (после перезагрузки повторить)."], "lims": ["Действия над другими приложениями требуют отладки по ADB этого же устройства или root (Magisk). Меню приложений работает локально и никуда ничего не отправляет; сетевые запросы только те, которые вы сами запускаете (поиск в F-Droid и GitHub, введённая ссылка).", "Автоподключение ADB на Android 11+ использует службу спецвозможностей. Она читает только окна системных настроек и действует три минуты после нажатия «Подключить автоматически». Проверено на Samsung One UI; на других прошивках пункты настроек могут называться иначе, тогда используйте ручной способ.", "Настоящий Wi‑Fi Direct не используется: файлы принимаются через страницу в браузере в той же сети или через точку доступа телефона. Файлы OBB на Android 11 и новее копируются только через ADB.", "Системные приложения не удаляются. В Google Play программы нет: скачивайте APK здесь; Android может предупредить о неизвестном источнике.", "Проверено на Android 9, 10, 11, 12 и 15. На Android 13 и 14 и прошивках других производителей пока не проверялось, отзывы приветствуются. Известно: копии Samsung Dual Messenger отображаются отдельными значками."], "smart": "APK подписан, но его нет в Google Play, поэтому Android может попросить разрешить установку из этого источника. Контрольная сумма SHA-256 указана в описании релиза.", "note": "Меню приложений: независимый проект, не связан с Google. Android и Android TV — торговые марки Google LLC.", "f_rel": "Все версии", "f_issue": "Сообщить о проблеме", "f_src": "Код на GitHub", "f_contacts": "Контакты", "f_terms": "Правила и условия", "f_refund": "Правила возврата средств", "f_oferta": "Публичный договор", "star_btn": "⭐ Звезда на GitHub", "star_p": "Бесплатный способ помочь: поставьте звезду репозиторию на GitHub. Это ничего не стоит и помогает другим найти программу.", "cap_menu": "Меню на ТВ-приставке: большая сетка для пульта.", "cap_actions": "Долгое нажатие на значок: остановить, кэш, данные, права, спецдоступ, батарея, скрыть, удалить, значок, папка, версии.", "cap_folder": "Папка: перетаскивайте значки в неё или добавляйте изнутри.", "cap_versions": "Любая версия приложения: сохранённые копии, каталог F-Droid, свой файл. В том числе более старая.", "cap_bundle": "Пакет из нескольких частей (APKS, XAPK) ставится как одно приложение: нужные устройству части выбираются сами.", "cap_phone": "На телефоне: то же меню в портрете."}, "uk": {"name": "Меню застосунків", "title": "Меню застосунків: повноекранне меню застосунків для приставок і телефонів (безкоштовно)", "h1": "Меню застосунків для приставок, автомагнітол і телефонів", "lead": "Повноекранне меню застосунків для приставок Android TV, автомагнітол і телефонів: пульт, дотик, миша й аеромиша. Довге натискання на значок: зупинити, кеш, дані, дозволи, теки й будь-яка версія застосунку. Без реклами.", "dl": "Завантажити APK", "gh": "Дивитися на GitHub", "back": "Усі наші програми", "dlnote": "Поточна версія: 1.1. AppMenu-1.1.apk. Безкоштовно, без реклами. Android 6.0 і новіше. Інтерфейс українською, російською та англійською.", "f_h": "Можливості", "s_h": "Скриншоти", "st_h": "Швидкий старт", "lm_h": "Обмеження та попередження", "d_h": "Підтримати проєкт", "d_p": "Програма безкоштовна. Якщо вона вам корисна, можна підтримати розробку банківською карткою, Google Pay або USDT. Для USDT лише мережа TRON (TRC20): монети, надіслані іншою мережею, втрачаються.", "d_btn": "Способи підтримки", "c1": "Меню застосунків замінює штатний список застосунків великою сіткою для пульта й дотику. У ньому є те, чого бракує штатним лаунчерам: картка дій на кожному значку, як в One UI, теки, пакетне встановлення й видалення, копії перед видаленням і встановлення будь-якої версії, зокрема старішої.", "feats": [["Що нового в 1.1", "Root (Magisk) замість ADB: якщо на пристрої є root (автомагнітола, приставка, телефон), програма працює без комп’ютера й без налагодження — зупинка, кеш, дані, дозволи, спецдоступ, тихе встановлення й видалення, OBB, пониження версії та флешки йдуть через root. Один раз дозвольте root програмі в Magisk — далі вона підключається сама. У «Налаштування» → «Підключити ADB» є кнопка «Підключити через root» і перемикач. Без root усе працює через ADB, як раніше. Вибір за вами: перемикач вирішує, що використовувати під час запуску, а кнопки підключення ADB перемикають на ADB. • Виправлено: на телефонах Samsung встановлення через ADB могло додати другий значок того самого застосунку (копію в «Подвійному застосунку»). Тепер застосунки встановлюються лише поточному користувачеві."], ["Меню для пульта, дотику, миші й аеромиші", "Повноекранна сітка: ОК відкриває, утримання ОК або кнопка «Меню» показує дії, дотик і миша працюють як зазвичай (ліва кнопка відкриває, права показує дії, колесо прокручує). Стовпці, розмір значків до дуже дрібних (на телефоні 5 стовпців), підписи, сортування (ім’я, нові, старі, часті, своє), пошук, приховування, режим списку."], ["Картка дій на кожному значку", "Як в One UI: зупинити, очистити кеш, очистити дані, дозволи, спецдоступ (з автовідновленням після перезавантаження), батарея, приховати, видалити, значок, тека, версії. Потрібен ADB цього ж пристрою (див. нижче)."], ["Теки", "Перетягни один значок на інший, щоб утворилась тека, перетягуй значки до неї або додавай зсередини; перейменування й видалення. Вікно теки: сітка 5×5."], ["Встановлення звідки завгодно", "APK, пакети з кількох частин (APKS, APKM, XAPK, ZIP з APK і OBB: потрібні пристрою частини обираються самі), з теки або архіву (ZIP, 7z, RAR, TAR), із вбудованого файлового менеджера, з флешок (через ADB, коли система їх не показує), з мережевих тек (SMB, з пошуком у локальній мережі), з телефона чи комп’ютера по Wi‑Fi (сторінка в браузері) та з інтернету (F-Droid, GitHub, пряме посилання). Пакетне встановлення й пакетне видалення."], ["Копії та будь-яка версія", "Перед видаленням застосунку його APK зберігається. Став будь-яку збережену версію, версію з каталогу F-Droid або свій файл, зокрема старішу (поточна версія перед цим зберігається)."], ["Режим лаунчера", "Кнопка «Додому» показує це меню, друге натискання відкриває рідний головний екран, «Назад» із застосунку повертає до меню. Вмикається й вимикається в налаштуваннях."], ["Вигляд і мова", "Тема: темна, чорна (OLED), світла або як у системі; шість кольорів акценту; українська, російська й англійська; власні значки та набори значків; копія й відновлення налаштувань."], ["Просте підключення ADB", "На ТВ-приставках з Android 9 і ввімкненим мережевим ADB підключається саме. На Android 11+ натисни «Підключити автоматично»: програма ввімкне бездротове налагодження, прочитає код сполучення й сполучиться сама (потрібна її служба спецможливостей, вона діє лише після твого натискання). Android 10 і старіші: один раз команда з комп’ютера, далі підключається саме."], ["Безкоштовно", "Без реклами, відкритий код."]], "steps": ["Завантажте AppMenu-1.1.apk і встановіть його (якщо Android запитає, дозвольте встановлення з цього джерела). Значок «Меню застосунків» з’явиться у списку застосунків (на ТВ-приставці в Leanback-лаунчері).", "Відкрийте: застосунки запускаються за ОК або дотиком, довге натискання (утримання ОК або кнопка «Меню») відкриває картку дій. Щоб користуватись ним замість штатного меню, увімкніть «Режим лаунчера» в налаштуваннях.", "Для дій над іншими застосунками підключіть ADB: «Налаштування» → «Підключити ADB». ТВ-приставки з Android 9 і мережевим ADB підключаються самі. Android 11+: один раз увімкніть службу «Меню застосунків» у спецможливостях і натисніть «Підключити автоматично». Android 10 і старіші: один раз виконайте adb tcpip 5555 з комп’ютера (після перезавантаження повторити)."], "lims": ["Дії над іншими застосунками потребують налагодження по ADB цього ж пристрою або root (Magisk). Меню застосунків працює локально й нічого нікуди не надсилає; мережеві запити лише ті, які ви самі запускаєте (пошук у F-Droid і GitHub, введене посилання).", "Автопідключення ADB на Android 11+ використовує службу спецможливостей. Вона читає лише вікна системних налаштувань і діє три хвилини після натискання «Підключити автоматично». Перевірено на Samsung One UI; на інших прошивках пункти налаштувань можуть називатися інакше, тоді використовуйте ручний спосіб.", "Справжній Wi‑Fi Direct не використовується: файли приймаються через сторінку в браузері в тій самій мережі або через точку доступу телефона. Файли OBB на Android 11 і новіше копіюються лише через ADB.", "Системні застосунки не видаляються. У Google Play програми немає: завантажуйте APK тут; Android може попередити про невідоме джерело.", "Перевірено на Android 9, 10, 11, 12 і 15. На Android 13 і 14 та прошивках інших виробників поки не перевірялося, відгуки вітаються. Відомо: копії Samsung Dual Messenger відображаються окремими значками."], "smart": "APK підписано, але його немає в Google Play, тому Android може попросити дозволити встановлення з цього джерела. Контрольну суму SHA-256 вказано в описі релізу.", "note": "Меню застосунків: незалежний проєкт, не пов’язаний з Google. Android і Android TV — торгові марки Google LLC.", "f_rel": "Усі версії", "f_issue": "Повідомити про проблему", "f_src": "Код на GitHub", "f_contacts": "Контакти", "f_terms": "Правила та умови", "f_refund": "Правила повернення коштів", "f_oferta": "Публічний договір", "star_btn": "⭐ Зірка на GitHub", "star_p": "Безкоштовний спосіб допомогти: поставте зірку репозиторію на GitHub. Це нічого не коштує й допомагає іншим знайти програму.", "cap_menu": "Меню на ТВ-приставці: велика сітка для пульта.", "cap_actions": "Довге натискання на значок: зупинити, кеш, дані, дозволи, спецдоступ, батарея, приховати, видалити, значок, тека, версії.", "cap_folder": "Тека: перетягуйте значки до неї або додавайте зсередини.", "cap_versions": "Будь-яка версія застосунку: збережені копії, каталог F-Droid, власний файл. Зокрема старіша.", "cap_bundle": "Пакет із кількох частин (APKS, XAPK) ставиться як один застосунок: потрібні пристрою частини обираються самі.", "cap_phone": "На телефоні: те саме меню в портреті."}};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function setLang(l){
  var d = I18N[l] || I18N.en;
  document.documentElement.lang = l;
  document.title = d.title;
  var nodes = document.querySelectorAll("[data-i]");
  for (var i = 0; i < nodes.length; i++){ var k = nodes[i].getAttribute("data-i"); if (d[k] != null) nodes[i].textContent = d[k]; }
  document.getElementById("features").innerHTML = d.feats.map(function(f){return '<div class="card"><b>'+esc(f[0])+'</b>'+esc(f[1])+'</div>'}).join("");
  document.getElementById("steps").innerHTML = d.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join("");
  document.getElementById("lims").innerHTML = d.lims.map(function(s){return '<li>'+esc(s)+'</li>'}).join("");
  ["menu", "actions", "folder", "versions", "bundle", "phone"].forEach(function(k){ document.getElementById("img_"+k).src = "app_menu_"+k+"_"+l+".png"; });
  var b = document.querySelectorAll(".langs button");
  for (var j = 0; j < b.length; j++) b[j].setAttribute("aria-pressed", b[j].getAttribute("data-lang") === l ? "true" : "false");
  try { localStorage.setItem("piws-lang", l); } catch (e) {}
}
