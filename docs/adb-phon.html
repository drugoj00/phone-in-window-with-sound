var I18N = {"en": {"name": "ADB-phon", "title": "ADB-phon: Free ADB manager right on your phone (free)", "h1": "ADB manager right on your phone", "lead": "Free ADB manager right on your phone: install APKs over ADB, air mouse and remote control, special access that survives a reboot. No computer needed, root is optional (with root even ADB is not needed).", "dl": "Download APK", "gh": "View on GitHub", "back": "All our programs", "dlnote": "Current version: 2.0. ADB-phon-2.0.apk. Free, no ads. Android 8.0 and newer. Interface in English, Ukrainian and Russian.", "f_h": "Features", "s_h": "Screenshots", "st_h": "Quick start", "lm_h": "Limitations and warnings", "d_h": "Support the project", "d_p": "The app is free. If it is useful you can support its development by card, Google Pay or USDT. For USDT use only the TRON network (TRC20): coins sent over another network are lost.", "d_btn": "Donation options", "c1": "ADB-phon connects to the ADB of the same phone (or of another device in your network) and runs commands with shell rights, as if the phone were plugged into a computer.", "feats": [["What's new in 2.0", "SSH: terminal and files (SFTP) of a computer or server. • PC mouse: the phone as a Bluetooth mouse and keyboard. • Remote: “Swipe” tab (swipes = arrow keys, scroll buttons); keys are instant. • Autoconnect to the last device at start; the connected device is highlighted. • Long press on a device: connect or disconnect; “Connected: name · address”. • “Restart launcher” button against stuck arrows on TV boxes. • Button to delete saved old versions; compact interface. • Fixed: control tabs shown without a real connection; another device taken for this phone; remote keys lagged about 1 s."], ["Install APK over ADB", "Install or update apps through ADB, no computer needed. Sources: a file, a folder, an archive (ZIP, 7z, RAR, TAR), the built-in file manager (including USB drives through ADB), network folders (SMB), files sent over Wi-Fi from a browser, search on the internet (F-Droid, GitHub, a link). Multi-part packages APKS, APKM, XAPK and ZIP with APK and OBB: the parts for your phone are picked automatically. Batch install."], ["Air mouse and mouse", "The phone’s gyroscope works as a pointer. A real cursor appears on the screen of the controlled device (a helper creates a virtual mouse). The “Air” button works in two modes picked with a round switch: tap to turn on and tap again to turn off, or hold it while you move the phone. Click, scroll, OK, Back, Home, Menu, arrows, volume, sound and microphone on/off. Touch mode is instant too: the helper injects real touches, so taps and swipes work even on slow TV boxes."], ["Special access, survives reboot", "Turn on an accessibility service, keep it enabled after a reboot (Android 13–14 often switch it off), remove “restricted settings”, allow writing secure settings, draw over other apps, notifications, usage stats, all files, install unknown apps, no battery limits."], ["Remote control", "Four switchable modes: Keys, Swipe, Mouse, Air. Home, Back, Menu, D-pad and OK, volume, media keys, power, recents, text input. Swipes act as arrow keys, tap is OK, scroll buttons. Keys are instant. For phones, TVs and set-top boxes."], ["SSH", "Connect to a computer or server over SSH (Linux, macOS, Windows with an SSH server): terminal and files over SFTP (browse, download, upload, delete). Password login; the server key is remembered on first connect."], ["PC mouse", "The phone works as a Bluetooth mouse and keyboard for a computer, laptop, tablet, iPhone or TV (Android 9+): touch pad, clicks, scroll, Enter, Esc, arrows, Win, Ctrl+C/V, text input. Nothing to install on the computer."], ["Easy connection", "Finds devices in the network and shows their names, favourites with your own names, manual IP. Android 11+: automatic pairing without typing a code (an accessibility service reads the code from the system window) or pairing by code. Android 8–10: one command from a computer once, then the app connects by itself. Control another device by IP; press and hold a device to disconnect."], ["Apps", "Icons, search, filters (user, system, junk, disabled, removed), disable and enable, uninstall and restore, stop, clear data, save APK, permission switches, batch actions (including batch uninstall), protection of critical packages, “Clean RAM” button."], ["Cleaner for junk apps", "The “Junk” filter shows well-known unneeded system apps (Samsung, Google, Microsoft, Facebook services, partner apps) with marks “safe” and “careful”. “Select safe” and disable them; it is reversible (Disabled, then Enable)."], ["Copies and versions", "Before an app is uninstalled its APK is saved. The “Versions” button installs any version, including an older one, from saved copies, from F-Droid or from your own file."], ["Files", "Browse folders including Android/data, create, rename, copy, move, delete."], ["Phone", "Device info, monitor, screenshot, screen recording, clear all caches, quick settings (dark mode, Wi-Fi, data, Bluetooth, rotation, font, screen timeout, show touches, animations, DPI), reboot (normal, recovery, bootloader)."], ["Console", "Any shell command."], ["Settings", "Theme (auto, light, dark), language (English, Ukrainian, Russian), keep screen on, bug log, backup and restore of settings to a folder you choose, install any version of the program from GitHub."], ["Free", "No ads, open source."]], "steps": ["Download ADB-phon-2.0.apk and install it (allow installing from this source if Android asks).", "Android 11 and newer: Settings, Developer options, turn on “Wireless debugging”, tap “Pair device with pairing code”. Open ADB-phon in split screen or a floating window, enter the port and the code, tap “Pair”, then “Connect”.", "Android 8–10: once, from a computer with USB debugging, run adb tcpip 5555. In ADB-phon tap “Connect” and allow debugging on the phone.", "For another device (TV, second phone) tap it in the “Devices in the network” list or type its IP."], "lims": ["Actions on system apps can break the phone: be careful, the app asks for confirmation and protects critical packages.", "ADB-phon works locally and sends nothing anywhere. The cursor helper and the remote control manage a whole device: connect only to your own devices.", "The app is not on Google Play (it would not be allowed): download the APK here. Android may warn about installing from an unknown source.", "Tested on two phones (Android 10 and 15) and one TV box (Android 11). Not yet tested on Android 8–9 and 11–14 devices of other makers; reports are welcome.", "SSH and “PC mouse” are new and tested only partly: SSH against OpenSSH for Windows up to the password step, the Bluetooth mouse is not on every phone (some firmwares switch the HID profile off).", "Special access settings can differ on Xiaomi, Huawei and other firmwares; on Xiaomi also turn on “USB debugging (security settings)”."], "smart": "The APK is signed but is not on Google Play, so Android may ask you to allow installing from this source. The SHA-256 checksum is in the release description.", "note": "ADB-phon is an independent project, not related to Google. Android is a trademark of Google LLC.", "f_rel": "All versions", "f_issue": "Report a problem", "f_src": "Source on GitHub", "f_contacts": "Contacts", "f_terms": "Terms and conditions", "f_refund": "Refund policy", "f_oferta": "Public offer", "star_btn": "⭐ Star on GitHub", "star_p": "A free way to help: put a star on the GitHub repository. It costs nothing and helps other people find the program.", "cap_connect": "Connection: the connected device is highlighted, “Connected: name · address”.", "cap_special": "Special access: accessibility service that stays on after a reboot, restricted settings, secure settings.", "cap_air": "Air mouse: “Air on/off” button with a round mode switch (toggle or hold), click, arrows, Back, Home, Menu, volume, player keys.", "cap_remote": "Remote, “Keys”: D-pad, volume, media, text input, restart launcher.", "cap_apps": "Apps with icons, search, filters and “Install APK”.", "cap_phone": "Phone: device info, monitor, screenshot, recording, quick settings.", "cap_swipe": "Remote, “Swipe”: swipes are arrow keys, tap is OK, scroll buttons.", "cap_ssh": "SSH: terminal and files of a computer or server."}, "ru": {"name": "ADB-phon", "title": "ADB-phon: Бесплатный ADB-менеджер прямо на телефоне (бесплатно)", "h1": "ADB-менеджер прямо на телефоне", "lead": "Бесплатный ADB-менеджер прямо на телефоне: установка APK по ADB, аэромышь и пульт, особые права, которые переживают перезагрузку. Без компьютера, root не обязателен (с root не нужен даже ADB).", "dl": "Скачать APK", "gh": "Смотреть на GitHub", "back": "Все наши программы", "dlnote": "Текущая версия: 2.0. ADB-phon-2.0.apk. Бесплатно, без рекламы. Android 8.0 и новее. Интерфейс на русском, украинском и английском.", "f_h": "Возможности", "s_h": "Скриншоты", "st_h": "Быстрый старт", "lm_h": "Ограничения и предупреждения", "d_h": "Поддержать проект", "d_p": "Программа бесплатная. Если она вам полезна, можно поддержать разработку банковской картой, Google Pay или USDT. Для USDT только сеть TRON (TRC20): монеты, отправленные по другой сети, теряются.", "d_btn": "Способы поддержки", "c1": "ADB-phon подключается к ADB этого же телефона (или другого устройства в сети) и выполняет команды с правами оболочки, как будто телефон подключён к компьютеру.", "feats": [["Что нового в 2.0", "SSH: терминал и файлы (SFTP) компьютера или сервера. • Мышь ПК: телефон как Bluetooth-мышь и клавиатура. • Пульт: вкладка «Свайп» (свайпы = стрелки, прокрутка); кнопки мгновенные. • Автоподключение к последнему устройству при запуске; подключённое выделено. • Долгий тап по устройству: подключить или отключить; «Подключено: название · адрес». • Кнопка «Перезапустить лончер» против залипших стрелок на ТВ-приставках. • Удаление сохранённых прошлых версий; компактный интерфейс. • Исправлено: вкладки управления без реального подключения; чужое устройство принималось за этот телефон; кнопки пульта срабатывали с задержкой ~1 с."], ["Установка APK по ADB", "Установка и обновление приложений через ADB, компьютер не нужен. Источники: файл, папка, архив (ZIP, 7z, RAR, TAR), встроенный файловый менеджер (в том числе флешки через ADB), сетевые папки (SMB), приём файлов по Wi‑Fi из браузера, поиск в интернете (F-Droid, GitHub, ссылка). Пакеты из нескольких частей APKS, APKM, XAPK и ZIP с APK и OBB: нужные части для вашего телефона выбираются сами. Пакетная установка."], ["Аэромышь и мышь", "Гироскоп телефона работает как указка. На экране управляемого устройства появляется настоящий курсор (помощник создаёт виртуальную мышь). Кнопка «Воздух» работает в двух режимах, которые выбираются круглым переключателем: коснуться, чтобы включить, и ещё раз, чтобы выключить, либо держать, пока водишь телефоном. Клик, прокрутка, ОК, Назад, Домой, Меню, стрелки, громкость, звук и микрофон вкл/выкл. Касание тоже мгновенное: помощник отправляет настоящие касания, поэтому тапы и свайпы работают даже на слабых ТВ-приставках."], ["Особые права, переживают перезагрузку", "Включение службы спецвозможностей, удержание её после перезагрузки (на Android 13–14 она часто выключается сама), снятие «ограниченных настроек», запись защищённых настроек, поверх других окон, уведомления, статистика, все файлы, установка из неизвестных источников, без ограничений батареи."], ["Пульт", "Четыре режима переключателем: Кнопки, Свайп, Мышь, Воздух. Домой, назад, меню, крестовина и ОК, громкость, медиа-кнопки, питание, недавние, ввод текста. Свайпы = стрелки, касание = ОК, кнопки прокрутки. Кнопки срабатывают мгновенно. Для телефонов, телевизоров и приставок."], ["SSH", "Подключение к компьютеру или серверу по SSH (Linux, macOS, Windows с SSH-сервером): терминал и файлы по SFTP (просмотр, скачать, загрузить, удалить). Вход по паролю; ключ сервера запоминается при первом подключении."], ["Мышь ПК", "Телефон работает как Bluetooth-мышь и клавиатура для компьютера, ноутбука, планшета, iPhone или телевизора (Android 9+): тачпад, клики, прокрутка, Enter, Esc, стрелки, Win, Ctrl+C/V, ввод текста. На компьютер ничего ставить не нужно."], ["Простое подключение", "Автопоиск устройств в сети с именами, избранные с вашими названиями, ручной ввод IP. Android 11+: автоматическое сопряжение без ввода кода (служба спецвозможностей сама читает код в системном окне) или сопряжение по коду. Android 8–10: один раз команда с компьютера, дальше программа подключается сама. Управление другим устройством по IP; долгое нажатие на устройство — отключиться."], ["Приложения", "Значки, поиск, фильтры (мои, системные, мусор, отключённые, удалённые), отключить и включить, удалить и восстановить, остановить, очистить данные, сохранить APK, разрешения переключателями, пакетные действия (в том числе пакетное удаление), защита критичных пакетов, кнопка «Очистить ОЗУ»."], ["Чистильщик лишнего", "Фильтр «Мусор» показывает известные ненужные системные приложения (Samsung, Google, Microsoft, службы Facebook, партнёрские) с метками «безопасно» и «осторожно». «Выбрать безопасные» и отключить; это обратимо («Отключённые» → «Включить»)."], ["Копии и версии", "Перед удалением приложения его APK сохраняется. Кнопка «Версии» ставит любую версию, в том числе старую, из сохранённых копий, из F-Droid или из своего файла."], ["Файлы", "Обзор папок, в том числе Android/data, создать, переименовать, копировать, переместить, удалить."], ["Телефон", "Сведения об устройстве, мониторинг, снимок и запись экрана, очистка кэша всех приложений, быстрые настройки (тёмная тема, Wi-Fi, данные, Bluetooth, автоповорот, шрифт, гашение экрана, показ касаний, анимации, DPI), перезагрузка (обычная, recovery, загрузчик)."], ["Консоль", "Любые команды оболочки."], ["Настройки", "Тема (авто, светлая, тёмная), язык (русский, украинский, английский), держать экран включённым, журнал для поиска ошибок, резервная копия и восстановление настроек в выбранную папку, установка любой версии программы с GitHub."], ["Бесплатно", "Без рекламы, исходный код открыт."]], "steps": ["Скачайте ADB-phon-2.0.apk и установите его (если Android спросит, разрешите установку из этого источника).", "Android 11 и новее: «Настройки» → «Для разработчиков» → включите «Беспроводная отладка» → «Подключение устройства с помощью кода». Откройте ADB-phon в разделённом экране или плавающем окне, введите порт и код, нажмите «Сопряжение», затем «Подключиться».", "Android 8–10: один раз с компьютера по USB выполните adb tcpip 5555. В ADB-phon нажмите «Подключиться» и разрешите отладку на телефоне.", "Для другого устройства (телевизор, второй телефон) нажмите его в списке «Устройства в сети» или введите IP."], "lims": ["Действия над системными приложениями могут сломать телефон: будьте осторожны, программа просит подтверждение и защищает критичные пакеты.", "ADB-phon работает локально и никуда ничего не отправляет. Помощник с курсором и пульт управляют устройством целиком: подключайтесь только к своим устройствам.", "В Google Play программы нет (такое там не разрешено): скачивайте APK здесь. Android может предупредить об установке из неизвестного источника.", "Проверено на двух телефонах (Android 10 и 15) и одной ТВ-приставке (Android 11). На Android 8–9 и 11–14 других производителей пока не проверялось, отзывы приветствуются.", "SSH и «Мышь ПК» новые и проверены частично: SSH — на совместимость с OpenSSH для Windows до этапа пароля; Bluetooth-мышь есть не на всех телефонах (часть прошивок выключает профиль HID).", "Особые права на Xiaomi, Huawei и других прошивках могут отличаться; на Xiaomi включите ещё «Отладка по USB (настройки безопасности)»."], "smart": "APK подписан, но его нет в Google Play, поэтому Android может попросить разрешить установку из этого источника. Контрольная сумма SHA-256 указана в описании релиза.", "note": "ADB-phon: независимый проект, не связан с Google. Android — торговая марка Google LLC.", "f_rel": "Все версии", "f_issue": "Сообщить о проблеме", "f_src": "Код на GitHub", "f_contacts": "Контакты", "f_terms": "Правила и условия", "f_refund": "Правила возврата средств", "f_oferta": "Публичный договор", "star_btn": "⭐ Звезда на GitHub", "star_p": "Бесплатный способ помочь: поставьте звезду репозиторию на GitHub. Это ничего не стоит и помогает другим найти программу.", "cap_connect": "Подключение: подключённое устройство выделено, «Подключено: название · адрес».", "cap_special": "Особые права: служба спецвозможностей, которая остаётся после перезагрузки, ограниченные настройки, защищённые настройки.", "cap_air": "Аэромышь: кнопка «Воздух вкл/выкл» с круглым переключателем режима (переключение или удержание), клик, стрелки, Назад, Домой, Меню, громкость, кнопки плеера.", "cap_remote": "Пульт, «Кнопки»: крестовина, громкость, медиа, ввод текста, перезапуск лончера.", "cap_apps": "Приложения: значки, поиск, фильтры и «Установить APK».", "cap_phone": "Телефон: сведения, мониторинг, снимок, запись экрана, быстрые настройки.", "cap_swipe": "Пульт, «Свайп»: свайпы = стрелки, касание = ОК, кнопки прокрутки.", "cap_ssh": "SSH: терминал и файлы компьютера или сервера."}, "uk": {"name": "ADB-phon", "title": "ADB-phon: Безкоштовний ADB-менеджер прямо на телефоні (безкоштовно)", "h1": "ADB-менеджер прямо на телефоні", "lead": "Безкоштовний ADB-менеджер прямо на телефоні: встановлення APK через ADB, аеромиша й пульт, особливі права, що переживають перезавантаження. Без комп’ютера, root не обов’язковий (з root не потрібен навіть ADB).", "dl": "Завантажити APK", "gh": "Дивитися на GitHub", "back": "Усі наші програми", "dlnote": "Поточна версія: 2.0. ADB-phon-2.0.apk. Безкоштовно, без реклами. Android 8.0 і новіше. Інтерфейс українською, російською та англійською.", "f_h": "Можливості", "s_h": "Скриншоти", "st_h": "Швидкий старт", "lm_h": "Обмеження та попередження", "d_h": "Підтримати проєкт", "d_p": "Програма безкоштовна. Якщо вона вам корисна, можна підтримати розробку банківською карткою, Google Pay або USDT. Для USDT лише мережа TRON (TRC20): монети, надіслані іншою мережею, втрачаються.", "d_btn": "Способи підтримки", "c1": "ADB-phon підключається до ADB цього ж телефона (або іншого пристрою в мережі) і виконує команди з правами оболонки, наче телефон підключено до комп’ютера.", "feats": [["Що нового в 2.0", "SSH: термінал і файли (SFTP) комп’ютера або сервера. • Миша ПК: телефон як Bluetooth-миша й клавіатура. • Пульт: вкладка «Свайп» (свайпи = стрілки, прокручування); кнопки миттєві. • Автопідключення до останнього пристрою під час запуску; підключений виділено. • Довгий дотик на пристрої: підключити або відключити; «Підключено: назва · адреса». • Кнопка «Перезапустити лончер» проти залиплих стрілок на ТВ-приставках. • Видалення збережених попередніх версій; компактний інтерфейс. • Виправлено: вкладки керування без справжнього підключення; чужий пристрій сприймався за цей телефон; кнопки пульта спрацьовували із затримкою ~1 с."], ["Встановлення APK через ADB", "Встановлення й оновлення застосунків через ADB, комп’ютер не потрібен. Джерела: файл, тека, архів (ZIP, 7z, RAR, TAR), вбудований файловий менеджер (зокрема флешки через ADB), мережеві теки (SMB), приймання файлів по Wi‑Fi з браузера, пошук в інтернеті (F-Droid, GitHub, посилання). Пакети з кількох частин APKS, APKM, XAPK і ZIP з APK та OBB: потрібні частини для вашого телефона обираються самі. Пакетне встановлення."], ["Аеромиша та миша", "Гіроскоп телефона працює як указка. На екрані керованого пристрою з’являється справжній курсор (помічник створює віртуальну мишу). Кнопка «Повітря» працює у двох режимах, які обираються круглим перемикачем: торкнутися, щоб увімкнути, і ще раз, щоб вимкнути, або тримати, поки водиш телефоном. Клік, прокручування, ОК, Назад, Додому, Меню, стрілки, гучність, звук і мікрофон увімк/вимк. Дотик теж миттєвий: помічник надсилає справжні дотики, тому тапи й свайпи працюють навіть на слабких ТВ-приставках."], ["Особливі права, переживають перезавантаження", "Увімкнення служби спецможливостей, утримання її після перезавантаження (на Android 13–14 вона часто вимикається сама), зняття «обмежених налаштувань», запис захищених налаштувань, поверх інших вікон, сповіщення, статистика, усі файли, встановлення з невідомих джерел, без обмежень батареї."], ["Пульт", "Чотири режими перемикачем: Кнопки, Свайп, Миша, Повітря. Додому, назад, меню, хрестовина й ОК, гучність, медіа-кнопки, живлення, останні, введення тексту. Свайпи = стрілки, дотик = ОК, кнопки прокручування. Кнопки спрацьовують миттєво. Для телефонів, телевізорів і приставок."], ["SSH", "Підключення до комп’ютера або сервера по SSH (Linux, macOS, Windows із SSH-сервером): термінал і файли по SFTP (перегляд, завантажити, вивантажити, видалити). Вхід за паролем; ключ сервера запам’ятовується під час першого підключення."], ["Миша ПК", "Телефон працює як Bluetooth-миша й клавіатура для комп’ютера, ноутбука, планшета, iPhone або телевізора (Android 9+): тачпад, кліки, прокручування, Enter, Esc, стрілки, Win, Ctrl+C/V, введення тексту. На комп’ютер нічого ставити не потрібно."], ["Просте підключення", "Автопошук пристроїв у мережі з іменами, обрані з вашими назвами, ручне введення IP. Android 11+: автоматичне сполучення без введення коду (служба спецможливостей сама читає код у системному вікні) або сполучення за кодом. Android 8–10: один раз команда з комп’ютера, далі програма підключається сама. Керування іншим пристроєм за IP; довге натискання на пристрій — відключитися."], ["Застосунки", "Значки, пошук, фільтри (мої, системні, сміття, вимкнені, видалені), вимкнути й увімкнути, видалити й відновити, зупинити, очистити дані, зберегти APK, дозволи перемикачами, пакетні дії (зокрема пакетне видалення), захист критичних пакетів, кнопка «Очистити ОЗП»."], ["Чистильник зайвого", "Фільтр «Сміття» показує відомі непотрібні системні застосунки (Samsung, Google, Microsoft, служби Facebook, партнерські) з позначками «безпечно» та «обережно». «Обрати безпечні» і вимкнути; це оборотно («Вимкнені» → «Увімкнути»)."], ["Копії та версії", "Перед видаленням застосунку його APK зберігається. Кнопка «Версії» встановлює будь-яку версію, зокрема стару, зі збережених копій, з F-Droid або зі свого файлу."], ["Файли", "Огляд тек, зокрема Android/data, створити, перейменувати, копіювати, перемістити, видалити."], ["Телефон", "Відомості про пристрій, моніторинг, знімок і запис екрана, очищення кешу всіх застосунків, швидкі налаштування (темна тема, Wi-Fi, дані, Bluetooth, автоповорот, шрифт, згасання екрана, показ дотиків, анімації, DPI), перезавантаження (звичайне, recovery, завантажувач)."], ["Консоль", "Будь-які команди оболонки."], ["Налаштування", "Тема (авто, світла, темна), мова (українська, російська, англійська), тримати екран увімкненим, журнал для пошуку помилок, резервна копія й відновлення налаштувань у вибрану теку, встановлення будь-якої версії програми з GitHub."], ["Безкоштовно", "Без реклами, відкритий код."]], "steps": ["Завантажте ADB-phon-2.0.apk і встановіть його (якщо Android запитає, дозвольте встановлення з цього джерела).", "Android 11 і новіше: «Налаштування» → «Для розробників» → увімкніть «Бездротове налагодження» → «Підключення пристрою за допомогою коду». Відкрийте ADB-phon у розділеному екрані або плаваючому вікні, введіть порт і код, натисніть «Сполучення», потім «Підключитись».", "Android 8–10: один раз з комп’ютера по USB виконайте adb tcpip 5555. В ADB-phon натисніть «Підключитись» і дозвольте налагодження на телефоні.", "Для іншого пристрою (телевізор, другий телефон) натисніть його у списку «Пристрої в мережі» або введіть IP."], "lims": ["Дії над системними застосунками можуть зламати телефон: будьте обережні, програма просить підтвердження й захищає критичні пакети.", "ADB-phon працює локально й нічого нікуди не надсилає. Помічник із курсором і пульт керують пристроєм цілком: підключайтеся лише до своїх пристроїв.", "У Google Play програми немає (такого там не дозволено): завантажуйте APK тут. Android може попередити про встановлення з невідомого джерела.", "Перевірено на двох телефонах (Android 10 і 15) та одній ТВ-приставці (Android 11). На Android 8–9 та 11–14 інших виробників поки не перевірялося, відгуки вітаються.", "SSH і «Миша ПК» нові й перевірені частково: SSH — на сумісність з OpenSSH для Windows до етапу пароля; Bluetooth-миша є не на всіх телефонах (частина прошивок вимикає профіль HID).", "Особливі права на Xiaomi, Huawei та інших прошивках можуть відрізнятися; на Xiaomi увімкніть ще «Налагодження по USB (налаштування безпеки)»."], "smart": "APK підписано, але його немає в Google Play, тому Android може попросити дозволити встановлення з цього джерела. Контрольну суму SHA-256 вказано в описі релізу.", "note": "ADB-phon: незалежний проєкт, не пов’язаний з Google. Android — торгова марка Google LLC.", "f_rel": "Усі версії", "f_issue": "Повідомити про проблему", "f_src": "Код на GitHub", "f_contacts": "Контакти", "f_terms": "Правила та умови", "f_refund": "Правила повернення коштів", "f_oferta": "Публічний договір", "star_btn": "⭐ Зірка на GitHub", "star_p": "Безкоштовний спосіб допомогти: поставте зірку репозиторію на GitHub. Це нічого не коштує й допомагає іншим знайти програму.", "cap_connect": "Підключення: підключений пристрій виділено, «Підключено: назва · адреса».", "cap_special": "Особливі права: служба спецможливостей, що лишається після перезавантаження, обмежені налаштування, захищені налаштування.", "cap_air": "Аеромиша: кнопка «Повітря вкл/вимк» з круглим перемикачем режиму (перемикання або утримання), клік, стрілки, Назад, Додому, Меню, гучність, кнопки плеєра.", "cap_remote": "Пульт, «Кнопки»: хрестовина, гучність, медіа, введення тексту, перезапуск лончера.", "cap_apps": "Застосунки: значки, пошук, фільтри та «Встановити APK».", "cap_phone": "Телефон: відомості, моніторинг, знімок, запис екрана, швидкі налаштування.", "cap_swipe": "Пульт, «Свайп»: свайпи = стрілки, дотик = ОК, кнопки прокручування.", "cap_ssh": "SSH: термінал і файли комп’ютера або сервера."}};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function setLang(l){
  var d = I18N[l] || I18N.en;
  document.documentElement.lang = l;
  document.title = d.title;
  var nodes = document.querySelectorAll("[data-i]");
  for (var i = 0; i < nodes.length; i++){ var k = nodes[i].getAttribute("data-i"); if (d[k] != null) nodes[i].textContent = d[k]; }
  document.getElementById("features").innerHTML = d.feats.map(function(f){return '<div class="card"><b>'+esc(f[0])+'</b>'+esc(f[1])+'</div>'}).join("");
  document.getElementById("steps").innerHTML = d.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join("");
  document.getElementById("lims").innerHTML = d.lims.map(function(s){return '<li>'+esc(s)+'</li>'}).join("");
  ["connect", "special", "air", "remote", "apps", "phone", "swipe", "ssh"].forEach(function(k){ document.getElementById("img_"+k).src = "adb_"+k+"_"+l+".png"; });
  var b = document.querySelectorAll(".langs button");
  for (var j = 0; j < b.length; j++) b[j].setAttribute("aria-pressed", b[j].getAttribute("data-lang") === l ? "true" : "false");
  try { localStorage.setItem("piws-lang", l); } catch (e) {}
}
(function () { try { var x = new XMLHttpRequest(); x.open("GET", "https://api.github.com/repos/drugoj00/adb-phon/releases/latest"); x.onload = function () { try { var r = JSON.parse(x.responseText), a = r.assets || []; for (var i = 0; i < a.length; i++) { if (/\.apk$/i.test(a[i].name)) { document.getElementById("dl").href = a[i].browser_download_url; break; } } } catch (e) {} }; x.send(); } catch (e) {} })();
(function(){
  var b = document.querySelectorAll(".langs button");
  for (var i = 0; i < b.length; i++) b[i].addEventListener("click", function(){ setLang(this.getAttribute("data-lang")); });
  var l = null;
  try { l = localStorage.getItem("piws-lang"); } catch (e) {}
  if (!I18N[l]) { var n = (navigator.language || "en").slice(0, 2).toLowerCase(); l = n === "uk" ? "uk" : (n === "ru" || n === "be" ? "ru" : "en"); }
  setLang(l);
})();
